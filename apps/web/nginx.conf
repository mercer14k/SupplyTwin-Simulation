server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'" always;
    location /api/ { proxy_pass http://api:8000; proxy_read_timeout 150s; }
    location /docs {
        proxy_pass http://api:8000;
        add_header Content-Security-Policy "default-src 'self' https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com" always;
    }
    location /openapi.json { proxy_pass http://api:8000; }
    location /health { proxy_pass http://api:8000; }
    location /ready { proxy_pass http://api:8000; }
    location / { try_files $uri $uri/ /index.html; }
}
