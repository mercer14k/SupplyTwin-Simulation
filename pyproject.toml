[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "supplytwin"
version = "0.1.0"
description = "A reproducible, simulation-first supply-chain digital twin"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "numpy>=2.2,<3", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "pip-audit>=2.9,<3"]

[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
pythonpath = [".", "packages"]
testpaths = ["tests/unit", "tests/integration"]

[tool.ruff]
extend-exclude = [".local", "output"]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"apps/api/main.py" = ["B008"] # FastAPI dependency injection defaults
"packages/supplytwin/engine.py" = ["B023"] # Day-local dispatch closure is called synchronously
